name: Generate contribution animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  animations:
    runs-on: ubuntu-latest
    steps:
      # Galaga-style ship that shoots down the contribution graph.
      # Runs first: snk runs in a root container and leaves dist/ unwritable.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate space shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install gh-space-shooter==2.0.5
          mkdir -p dist
          gh-space-shooter "${{ github.repository_owner }}" --output dist/space-shooter.gif --strategy random --fps 25

      # Lightsaber snake: yellow snake, hyperspace-blue contributions on black
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FFE81F&color_background=#000000&color_dots=#11161f,#0b3d5c,#1572a1,#2fb6e0,#9ff3ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
