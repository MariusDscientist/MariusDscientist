<g clip-path="url(#c)"><text class="ln ti" style="animation-delay:-24.80s">EPISODE I</text><text class="ln ti" style="animation-delay:-22.69s">THE DATA AWAKENS</text><text class="ln" style="animation-delay:-18.48s">It is a period of scattered data.</text><text class="ln" style="animation-delay:-16.38s">Records drift across spreadsheets</text><text class="ln" style="animation-delay:-14.27s">and legacy systems, and models are</text><text class="ln" style="animation-delay:-12.17s">used by many but understood by few.</text><text class="ln" style="animation-delay:-7.96s">In Pereira, Colombia, a Data &amp; AI</text><text class="ln" style="animation-delay:-5.85s">Engineer takes the slower path:</text><text class="ln" style="animation-delay:-3.75s">build the pipeline by hand, open</text><text class="ln" style="animation-delay:-1.64s">the model, and learn why it works.</text><text class="ln" style="animation-delay:2.57s">Because data only matters once</text><text class="ln" style="animation-delay:4.67s">it becomes a story someone</text><text class="ln" style="animation-delay:6.78s">can act on....</text>
