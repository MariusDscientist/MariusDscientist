<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A blue and a red lightsaber clash: every engineer has two sides"><style>.s0,.t1,.t2{fill:#fff}.s0{opacity:.5}
.t1{animation:tw 3.3s ease-in-out infinite}.t2{animation:tw 5.1s ease-in-out -2s infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.lt{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;font-size:40px;fill:none;stroke-width:1.8;letter-spacing:2px}
.sub{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-style:italic;font-size:19px;fill:#e8ecf5;text-anchor:middle;letter-spacing:1px}
.bl{animation:bh 1.1s ease-in-out infinite alternate}.rd{animation:rh .16s steps(2) infinite alternate}
@keyframes bh{from{opacity:.75}to{opacity:1}}@keyframes rh{from{opacity:.7}to{opacity:1}}
.spark{transform-box:fill-box;transform-origin:center;animation:sp .45s ease-out infinite}
@keyframes sp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.push{animation:push 3s ease-in-out infinite}@keyframes push{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}</style><defs>
