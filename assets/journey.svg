<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Career route: Physics Engineering at Universidad Tecnológica de Pereira 2018 to 2025; Digital Communicator at Banco de la República 2023 to 2024; Junior Data Scientist at Analytix Data 2025; AI Automation at HUBU 2026; now Data and AI Engineer in R and D and I.">
<style>
.s0,.t1,.t2,.t3{fill:#fff}
.s0{opacity:.55}
.t1{animation:tw 3.1s ease-in-out infinite}
.t2{animation:tw 4.7s ease-in-out -1.5s infinite}
.t3{animation:tw 6.3s ease-in-out -3s infinite}
