.or{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:#b9c0d4;text-anchor:middle}
.pulse{fill:none;stroke:#FFE81F;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-out infinite}
@keyframes pu{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.ship{fill:#fff}
</style>
